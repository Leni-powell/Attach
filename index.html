<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Attach - Reportabilidad inteligente</title>
    <meta name="description" content="Attach: Reportabilidad inteligente. Progressive Web App para supervisión e inspecciones técnicas en terreno, offline-first y mobile-first." />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#5E5365" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Attach" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <script>
      try {
        var s = localStorage.getItem('iaptidud_settings_v1') || localStorage.getItem('attach_settings_v1');
        if (s && JSON.parse(s).darkMode) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

    <!-- Open Graph -->
    <meta property="og:title" content="Attach - Reportabilidad inteligente" />
    <meta property="og:description" content="Attach: Reportabilidad inteligente. Progressive Web App para supervisión e inspecciones técnicas en terreno." />
    <meta property="og:type" content="website" />
  </head>
  <body class="bg-[#F5F7FA] text-slate-800 antialiased selection:bg-[#0057B8] selection:text-white dark:bg-slate-950 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registrado con éxito:', reg.scope))
            .catch((err) => console.log('Error registrando Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
